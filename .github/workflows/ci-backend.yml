name: CI backend

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy.sh"
      - "scripts/**"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/deploy-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy.sh"
      - "scripts/**"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/deploy-backend.yml"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avto
          POSTGRES_PASSWORD: avto
          POSTGRES_DB: avto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avto -d avto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://avto:avto@localhost:5432/avto_test
      TEST_DATABASE_URL: postgresql+asyncpg://avto:avto@localhost:5432/avto_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Tests
        run: uv run pytest
      - name: Migrations match models
        run: uv run alembic upgrade head && uv run alembic check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck deploy scripts
        run: shellcheck deploy.sh scripts/backup.sh
      - name: Build API image
        run: docker build backend/
