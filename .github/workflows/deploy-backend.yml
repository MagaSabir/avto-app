name: Deploy backend

on:
  workflow_run:
    workflows: ["CI backend"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy
        # The server's forced command runs deploy.sh; no remote command is given.
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes deploy@31.77.10.194
      - name: Health check
        run: curl -fsS --retry 5 --retry-delay 5 https://api.rossmik.ru/api/health
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
